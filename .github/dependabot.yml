# Dependabot version updates for every manifest in this monorepo.
# Security updates are always on; this file only controls routine bumps.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directories: ["/", "/editor", "/packages/npm"]
    schedule:
      interval: "weekly"
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/packages/python"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/packages/golang"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    directory: "/packages/java"
    schedule:
      interval: "weekly"
    groups:
      maven:
        patterns: ["*"]

  - package-ecosystem: "bundler"
    directory: "/packages/ruby"
    schedule:
      interval: "weekly"

  - package-ecosystem: "composer"
    directory: "/packages/php"
    schedule:
      interval: "weekly"
