name: Quick Schema Check

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  quick-lint:
    name: Quick Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      
      - name: Lint all schemas
        run: |
          chmod +x tools/lint-schemas.py
          python3 tools/lint-schemas.py || exit 1
      
      - name: Compare schemas
        run: |
          chmod +x tools/compare-schemas.py
          python3 tools/compare-schemas.py
      
      - name: Check JSON syntax
        run: |
          python3 -m json.tool schema.json > /dev/null && echo "✅ schema.json OK"
          python3 -m json.tool context.jsonld > /dev/null && echo "✅ context.jsonld OK"
          python3 -m json.tool meta-schema.json > /dev/null && echo "✅ meta-schema.json OK"

      - name: Run feature tests (work[].positions)
        run: |
          python3 -m pip install --quiet jsonschema
          python3 tests/positions/run-positions-tests.py
