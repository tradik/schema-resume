<?xml version="1.0" encoding="UTF-8"?>
<!--
  Social preview card, 1200x630.

  Source of truth for /og-image.png, which every page references as og:image
  and twitter:image. Until now that URL 404'd — the tags were there, the file
  never was, so every share rendered as a bare link. Regenerate the PNG with
  `make og-image` after editing this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"
     role="img" aria-label="Schema Resume — a JSON-LD schema for CV and resume data">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#sheen)"/>

  <!-- Document mark -->
  <g transform="translate(88 132)">
    <rect x="0" y="0" width="132" height="168" rx="12" fill="#ffffff" opacity="0.95"/>
    <rect x="22" y="30" width="66" height="10" rx="5" fill="#2563eb"/>
    <rect x="22" y="56" width="88" height="7" rx="3.5" fill="#93c5fd"/>
    <rect x="22" y="76" width="76" height="7" rx="3.5" fill="#93c5fd"/>
    <rect x="22" y="104" width="88" height="7" rx="3.5" fill="#cbd5e1"/>
    <rect x="22" y="124" width="62" height="7" rx="3.5" fill="#cbd5e1"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="264" y="196" fill="#ffffff" font-size="76" font-weight="700">Schema Resume</text>
    <text x="264" y="256" fill="#dbeafe" font-size="34" font-weight="500">
      A self-hosted JSON-LD schema for CV and resume data
    </text>

    <!-- Capability row -->
    <g fill="#ffffff" font-size="26" font-weight="600">
      <rect x="264" y="306" width="196" height="56" rx="28" fill="#ffffff" fill-opacity="0.16"/>
      <text x="362" y="343" text-anchor="middle">JSON Schema</text>

      <rect x="476" y="306" width="150" height="56" rx="28" fill="#ffffff" fill-opacity="0.16"/>
      <text x="551" y="343" text-anchor="middle">JSON-LD</text>

      <rect x="642" y="306" width="140" height="56" rx="28" fill="#ffffff" fill-opacity="0.16"/>
      <text x="712" y="343" text-anchor="middle">XML/XSD</text>

      <rect x="798" y="306" width="184" height="56" rx="28" fill="#ffffff" fill-opacity="0.16"/>
      <text x="890" y="343" text-anchor="middle">6 languages</text>
    </g>

    <text x="88" y="546" fill="#bfdbfe" font-size="30" font-weight="500">schema-resume.org</text>
    <text x="1112" y="546" fill="#bfdbfe" font-size="30" font-weight="500" text-anchor="end">MIT licensed</text>
  </g>

  <rect x="0" y="606" width="1200" height="24" fill="#facc15" opacity="0.9"/>
</svg>
